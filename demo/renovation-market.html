<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>装修行业 6 套模板｜码科服 CMS</title>
<style>*{box-sizing:border-box}body{margin:0;font:14px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#f5f6f8;color:#111827}a{text-decoration:none;color:inherit}.wrap{width:min(1460px,calc(100% - 40px));margin:auto}.top{height:70px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;position:sticky;top:0;z-index:30}.topin{display:flex;align-items:center;justify-content:space-between}.brand{font-size:20px;font-weight:950}.back{padding:9px 13px;border:1px solid #d8dde6;border-radius:9px;background:#fff;font-weight:800}.hero{padding:60px 0 28px}.hero h1{font-size:44px;margin:0 0 8px;letter-spacing:-.035em}.hero p{color:#667085;max-width:860px;font-size:16px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;padding-bottom:70px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;overflow:hidden}.preview{height:330px;background:#ddd;position:relative;overflow:hidden}.preview img{width:100%;height:100%;object-fit:cover}.overlay{position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,#0008)}.caption{position:absolute;left:22px;bottom:20px;color:#fff}.caption small{font-weight:800;opacity:.8}.caption h2{font-size:28px;margin:5px 0}.body{padding:20px}.tags{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.tag{font-size:11px;padding:4px 8px;border-radius:99px;background:#f3f4f6;color:#667085}.actions{display:flex;gap:8px;margin-top:14px}.btn{padding:9px 12px;border:1px solid #d8dde6;border-radius:8px;font-weight:850;background:#fff}.btn.dark{background:#111827;color:#fff;border-color:#111827}.note{background:#fff7ed;border:1px solid #fed7aa;padding:13px 15px;border-radius:12px;margin-bottom:20px;color:#9a3412}@media(max-width:850px){.grid{grid-template-columns:1fr}.preview{height:250px}}</style></head>
<body><header class="top"><div class="wrap topin"><div class="brand">码科服 CMS · 装修行业模板</div><a class="back" href="./industry-market.html">返回模板库</a></div></header>
<main class="wrap"><section class="hero"><h1>装修行业 · 6 套成品模板</h1><p>不是一套页面换 6 个颜色，而是围绕不同客户审美、项目类型和装修定位重新设计：首页结构、案例呈现、服务模块、设计团队、材料工艺、报价和内容中心都有差异。</p></section>
<div class="note">每套模板都支持：首页、装修案例、装修服务、设计团队、装修知识、预约量房等独立页面。安装时仍可选择仅安装模板、补充空白内容或导入完整演示数据。</div>
<section class="grid" id="grid"></section></main>
<script>
const covers=[
'https://images.unsplash.com/photo-1616486338812-3dadae4b4ace?auto=format&fit=crop&w=1600&q=86',
'https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=1600&q=86',
'https://images.unsplash.com/photo-1600566753086-00f18fb6b3ea?auto=format&fit=crop&w=1600&q=86',
'https://images.unsplash.com/photo-1493663284031-b7e3aefcae8e?auto=format&fit=crop&w=1600&q=86',
'https://images.unsplash.com/photo-1600210492486-724fe5c67fb0?auto=format&fit=crop&w=1600&q=86',
'https://images.unsplash.com/photo-1600573472592-401b489a3cdc?auto=format&fit=crop&w=1600&q=86'];
fetch('./renovation-variants.json').then(r=>r.json()).then(j=>{
 grid.innerHTML=j.templates.map((x,i)=>'<article class="card"><div class="preview"><img src="'+covers[i]+'" alt="'+x.display_name+'"><div class="overlay"></div><div class="caption"><small>'+x.style.toUpperCase()+'</small><h2>'+x.display_name+'</h2></div></div><div class="body"><b>'+x.brand+'</b><p style="color:#667085">'+x.headline+'</p><div class="tags">'+x.tags.map(t=>'<span class="tag">'+t+'</span>').join('')+'</div><div class="actions"><a class="btn" target="_blank" rel="noopener" href="'+x.preview+'">在线预览 ↗</a><a class="btn dark" href="./cms.html#theme-market">去后台安装</a></div></div></article>').join('')
})
</script></body></html>
