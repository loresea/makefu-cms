<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>模板详情｜码科服 CMS</title>
<style>*{box-sizing:border-box}body{margin:0;font:14px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#f6f8fb;color:#111827}a{text-decoration:none;color:inherit}.wrap{width:min(1280px,calc(100% - 40px));margin:auto}.top{height:70px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;position:sticky;top:0;z-index:30}.topin{display:flex;align-items:center;justify-content:space-between}.brand{font-size:20px;font-weight:950}.back{padding:9px 13px;border:1px solid #d8dde6;border-radius:9px;background:#fff;font-weight:800}.hero{padding:42px 0 24px}.grid{display:grid;grid-template-columns:1fr 360px;gap:22px}.panel{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:18px}.preview{overflow:hidden;border-radius:12px;background:#e5e7eb}.preview img{width:100%;display:block}.titleRow{display:flex;justify-content:space-between;gap:16px;align-items:start;margin-top:18px}.titleRow h1{font-size:32px;margin:0}.muted{color:#64748b}.chips{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.chip{font-size:11px;border:1px solid #e5e7eb;border-radius:99px;padding:5px 8px;color:#64748b}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}.stat{padding:12px;background:#f8fafc;border-radius:10px}.stat b{font-size:20px;display:block}.section{margin-top:18px}.section h2{font-size:20px;margin:0 0 10px}.list{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.item{padding:11px 12px;border:1px solid #e5e7eb;border-radius:10px}.side{position:sticky;top:88px;align-self:start}.logo{height:48px;max-width:280px}.side h3{font-size:18px;margin:18px 0 8px}.btn{display:flex;justify-content:center;align-items:center;width:100%;padding:11px 14px;border:1px solid #d8dde6;border-radius:9px;background:#fff;font-weight:850;margin-top:8px}.btn.dark{background:#111827;color:#fff;border-color:#111827}.metaRow{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px dashed #e5e7eb}.metaRow span{color:#64748b}.note{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;padding:11px 12px;border-radius:10px;margin-top:12px}@media(max-width:900px){.grid{grid-template-columns:1fr}.side{position:static}.stats{grid-template-columns:1fr 1fr}}@media(max-width:560px){.wrap{width:calc(100% - 24px)}.list{grid-template-columns:1fr}.titleRow{flex-direction:column}}</style></head>
<body><header class="top"><div class="wrap topin"><div class="brand">码科服 CMS · 模板详情</div><a class="back" href="./industry-market.html">返回模板中心</a></div></header>
<main class="wrap hero"><div class="grid"><section class="panel"><div class="preview"><img id="preview"></div><div class="titleRow"><div><h1 id="title"></h1><p id="desc" class="muted"></p></div><div id="badges" class="chips"></div></div><div class="stats"><div class="stat"><b id="rating"></b><span class="muted">评分</span></div><div class="stat"><b id="installs"></b><span class="muted">安装</span></div><div class="stat"><b id="views"></b><span class="muted">浏览</span></div><div class="stat"><b id="favorites"></b><span class="muted">收藏</span></div></div><div class="section"><h2>适合谁</h2><div id="uses" class="list"></div></div><div class="section"><h2>包含功能</h2><div id="features" class="list"></div></div><div class="section"><h2>完整页面</h2><div class="list"><div class="item">首页</div><div class="item">行业业务列表</div><div class="item">业务详情页</div><div class="item">案例 / 项目列表</div><div class="item">案例 / 项目详情</div><div class="item">新闻 / 内容列表</div><div class="item">文章详情页</div><div class="item">关于 / 联系 / 预约</div></div></div><div class="note">模板与真实业务数据分离。安装后可以替换 Logo、图片、文章、案例和业务内容，而不需要重新做页面结构。</div></section><aside class="panel side"><img id="logo" class="logo"><h3 id="sideTitle"></h3><div id="meta"></div><button id="favBtn" class="btn">收藏模板</button><a id="previewBtn" class="btn" target="_blank" rel="noopener">在线预览 ↗</a><a class="btn dark" href="./cms.html#theme-market">进入后台安装</a></aside></div></main>
<script src="./logo.js"></script><script src="./template-presets.js"></script><script src="./template-preview.js"></script><script src="./template-market-data.js"></script>
<script>
const slug=new URLSearchParams(location.search).get('slug');
async function run(){
 const [j,rv]=await Promise.all([fetch('./industries.json').then(r=>r.json()),fetch('./renovation-variants.json').then(r=>r.json()).catch(()=>({templates:[]}))]);
 const all=(j.industries||[]).filter(x=>x.slug!=='renovation').concat(rv.templates||[]);
 const index=all.findIndex(x=>x.slug===slug);const x=all[index>=0?index:0];const auto=getTemplatePreset(x,index>=0?index:0);const p=x.style?{...auto,style:x.style,layout:x.layout||auto.layout,motion:x.motion||auto.motion}:auto;const v=enrichMarketTemplate(x,p,index>=0?index:0);
 document.title=(x.display_name||x.name)+'｜模板详情';
 preview.src=makeTemplatePreview(x,p);title.textContent=x.display_name||x.name;desc.textContent=x.headline;logo.src=makeIndustryLogo(x.name,x.accent,x.family);sideTitle.textContent=x.brand||x.name;rating.textContent='★ '+v.stats.rating.toFixed(1);installs.textContent=marketNum(v.stats.installs);views.textContent=marketNum(v.stats.views);favorites.textContent=marketNum(v.stats.favorites);badges.innerHTML=[x.category,MARKET_STYLE_NAMES[p.style]||p.style,MARKET_LAYOUT_NAMES[p.layout]||p.layout,...v.badges].map(t=>'<span class="chip">'+t+'</span>').join('');uses.innerHTML=[v.position,...v.uses].map(t=>'<div class="item">'+t+'</div>').join('');features.innerHTML=v.features.map(t=>'<div class="item">✓ '+t+'</div>').join('');meta.innerHTML='<div class="metaRow"><span>行业</span><b>'+x.category+'</b></div><div class="metaRow"><span>风格</span><b>'+(MARKET_STYLE_NAMES[p.style]||p.style)+'</b></div><div class="metaRow"><span>布局</span><b>'+(MARKET_LAYOUT_NAMES[p.layout]||p.layout)+'</b></div><div class="metaRow"><span>最近更新</span><b>'+v.stats.updatedDays+' 天前</b></div>';previewBtn.href=x.preview;previewBtn.onclick=()=>marketMarkRecent(x.slug);function sync(){favBtn.textContent=marketIsFavorite(x.slug)?'取消收藏':'收藏模板'}favBtn.onclick=()=>{marketToggleFavorite(x.slug);sync()};sync();marketMarkRecent(x.slug)
}
run();
</script></body></html>
