<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>模板中心｜码科服 CMS</title>
<style>
*{box-sizing:border-box}body{margin:0;font:14px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#f6f8fb;color:#111827}a{text-decoration:none;color:inherit}button,input,select{font:inherit}.wrap{width:min(1480px,calc(100% - 40px));margin:auto}
.top{position:sticky;top:0;z-index:40;background:#ffffffed;backdrop-filter:blur(16px);border-bottom:1px solid #e5e7eb}.topin{height:72px;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:950}.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#fbbf24,#f97316);display:grid;place-items:center;color:#111}.back{padding:9px 13px;border:1px solid #d8dde6;border-radius:9px;background:#fff;font-weight:800}
.hero{padding:58px 0 28px}.hero h1{font-size:46px;letter-spacing:-.04em;margin:0 0 10px}.hero p{color:#64748b;max-width:900px;font-size:16px}.tabs{display:flex;gap:6px;background:#e9edf3;padding:5px;border-radius:11px;width:max-content;margin:20px 0 12px}.tabs button{border:0;background:transparent;border-radius:8px;padding:9px 18px;color:#667085;font-weight:850;cursor:pointer}.tabs button.on{background:#fff;color:#111827;box-shadow:0 2px 8px #0f172a12}
.collections{display:flex;gap:8px;overflow:auto;padding-bottom:12px}.collections button{border:1px solid #d8dde6;background:#fff;border-radius:999px;padding:8px 12px;white-space:nowrap;cursor:pointer;color:#475569}.collections button.on{background:#111827;color:#fff;border-color:#111827}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:8px 0 14px}.summary div{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:16px}.summary b{font-size:24px;display:block}.summary span{font-size:12px;color:#64748b}
.filter{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:14px;margin-bottom:16px}.searchrow{display:grid;grid-template-columns:1fr 180px;gap:10px}.search{display:flex;align-items:center;gap:8px;border:1px solid #d8dde6;border-radius:10px;padding:0 12px}.search input{width:100%;border:0;outline:0;padding:11px 0}.select{border:1px solid #d8dde6;border-radius:10px;padding:10px 12px;background:#fff}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}.count{margin-left:auto;color:#64748b}
.sectionHead{display:flex;justify-content:space-between;align-items:end;margin:20px 0 12px}.sectionHead h2{font-size:22px;margin:0}.sectionHead p{margin:4px 0 0;color:#64748b}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;padding-bottom:20px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:15px;overflow:hidden;position:relative;display:flex;flex-direction:column;transition:.2s}.card:hover{transform:translateY(-3px);box-shadow:0 18px 45px #11182712}.preview{height:175px;overflow:hidden;background:#e5e7eb}.preview img{width:100%;height:100%;object-fit:cover;display:block}.badges{position:absolute;left:10px;top:10px;display:flex;gap:5px}.badges span{font-size:10px;padding:4px 7px;border-radius:99px;background:#111827de;color:#fff;font-weight:900}.fav{position:absolute;right:10px;top:10px;width:32px;height:32px;border-radius:50%;border:1px solid #ffffff66;background:#11182799;color:#fff;display:grid;place-items:center;cursor:pointer}.fav.on{background:#fff;color:#ef4444}.body{padding:14px;display:flex;flex-direction:column;gap:8px;flex:1}.tplLogo{height:38px;width:auto;max-width:220px;object-fit:contain;object-position:left}.meta{display:flex;justify-content:space-between;gap:8px}.meta h3{margin:0;font-size:17px}.badge{font-size:10px;background:#f3f4f6;color:#64748b;padding:4px 7px;border-radius:99px}.desc{color:#64748b;min-height:42px}.audience{font-size:11px;background:#f8fafc;border:1px solid #eef2f6;padding:7px 8px;border-radius:8px;color:#475569}.chips{display:flex;gap:5px;flex-wrap:wrap}.chip{font-size:10px;border:1px solid #e5e7eb;border-radius:99px;padding:4px 7px;color:#64748b}.features{font-size:11px;color:#667085}.stats{display:flex;gap:8px;flex-wrap:wrap;font-size:11px;color:#64748b}.stats b{color:#334155}.actions{display:flex;gap:7px;margin-top:auto;flex-wrap:wrap}.btn{display:inline-flex;align-items:center;justify-content:center;padding:8px 10px;border:1px solid #d8dde6;border-radius:8px;background:#fff;font-weight:850;cursor:pointer}.btn.dark{background:#111827;color:#fff;border-color:#111827}.pager{display:flex;justify-content:center;gap:6px;padding:18px 0 60px}.pager button{width:34px;height:34px;border:1px solid #d8dde6;border-radius:8px;background:#fff}.pager button.on{background:#111827;color:#fff;border-color:#111827}
@media(max-width:1200px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.searchrow{grid-template-columns:1fr}.summary{grid-template-columns:1fr 1fr}}@media(max-width:580px){.grid{grid-template-columns:1fr}.wrap{width:calc(100% - 24px)}.tabs{width:100%;overflow:auto}.tabs button{flex:1}.count{width:100%;margin-left:0}.hero h1{font-size:36px}}
</style></head>
<body><header class="top"><div class="wrap topin"><div class="brand"><div class="logo">M</div><div>码科服 CMS<br><small style="font-weight:600;color:#64748b">行业模板中心</small></div></div><a class="back" href="./cms.html#theme-market">进入后台模板市场</a></div></header>
<main class="wrap">
<section class="hero"><h1>找到和客户想法匹配的网站模板</h1><p>覆盖 200 个行业，每个行业提供 6 套不同定位的成品网站，共 1200 套行业模板。支持按行业、风格、用途、热度、评分、安装量和最近更新筛选。</p></section>
<div class="tabs" id="tabs"><button class="on" data-tab="recommended">推荐</button><button data-tab="industry">行业</button><button data-tab="style">风格</button><button data-tab="mine">我的模板</button></div>
<div class="collections" id="collections"></div>
<div class="summary"><div><b id="total">0</b><span>当前模板</span></div><div><b>200</b><span>行业分类</span></div><div><b id="hotCount">0</b><span>热门模板</span></div><div><b id="favCount">0</b><span>我的收藏</span></div></div>
<div class="filter"><div class="searchrow"><div class="search">⌕ <input id="q" placeholder="搜索：装修 / 高端装修 / 外贸 / 机械 / 获客 / 极简..."></div><select id="sort" class="select"><option value="recommended">综合推荐</option><option value="hot">热门</option><option value="installs">安装最多</option><option value="favorites">收藏最多</option><option value="rating">评分最高</option><option value="new">最新</option><option value="updated">最近更新</option><option value="trending">上升最快</option></select></div><div class="filters"><select id="industry" class="select"><option value="">全部具体行业</option></select><select id="cat" class="select"><option value="">全部行业分类</option></select><select id="style" class="select"><option value="">全部设计风格</option></select><select id="use" class="select"><option value="">全部用途</option></select><select id="my" class="select" style="display:none"><option value="">我的全部</option><option value="installed">已安装</option><option value="favorites">收藏</option><option value="recent">最近浏览</option></select><span id="count" class="count"></span></div></div>
<div class="sectionHead"><div><h2 id="sectionTitle">精选推荐</h2><p id="sectionDesc">综合匹配度、安装、收藏、评分和近期热度推荐。</p></div></div>
<section id="grid" class="grid"></section><div id="pager" class="pager"></div>
</main>
<script src="./logo.js"></script><script src="./template-presets.js"></script><script src="./template-preview.js"></script><script src="./industry-deep-profiles.js"></script><script src="./industry-template-system.js"></script><script src="./template-market-data.js"></script>
<script>
let all=[],meta=[],page=1,tab='recommended',collection='recommended';
async function load(){
 const j=await fetch('./industries.json').then(r=>r.json());
 all=buildIndustryTemplates(j.industries||[]);
 meta=all.map((x,i)=>{const auto=getTemplatePreset(x,i),p=x.style?{...auto,style:x.style,layout:x.layout||auto.layout,motion:x.motion||auto.motion}:auto;return enrichMarketTemplate(x,p,i)});
 fill();renderCollections();summary();render();
}
function fill(){
 const im=new Map();all.forEach(x=>im.set(x.industry_slug,x.industry_name||x.display_name.split(' · ')[0]));[...im.entries()].sort((a,b)=>a[1].localeCompare(b[1],'zh-CN')).forEach(([slug,name])=>industry.insertAdjacentHTML('beforeend','<option value="'+slug+'">'+name+'</option>'));
 [...new Set(all.map(x=>x.category))].sort().forEach(x=>cat.insertAdjacentHTML('beforeend','<option>'+x+'</option>'));
 [...new Set(meta.map(v=>v.p.style))].sort().forEach(x=>style.insertAdjacentHTML('beforeend','<option value="'+x+'">'+(MARKET_STYLE_NAMES[x]||x)+'</option>'));
 [...new Set(meta.flatMap(v=>v.uses))].sort().forEach(x=>use.insertAdjacentHTML('beforeend','<option>'+x+'</option>'));
}
function renderCollections(){collections.innerHTML=MARKET_COLLECTIONS.map(x=>'<button class="'+(collection===x.id?'on':'')+'" onclick="collection=\''+x.id+'\';page=1;renderCollections();render()">'+x.name+'</button>').join('')}
function summary(){total.textContent=all.length+' 套';hotCount.textContent=meta.filter(v=>v.flags.isHot).length;favCount.textContent=marketFavorites().length}
function setTab(t){tab=t;page=1;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));my.style.display=t==='mine'?'inline-flex':'none';collection=t==='recommended'?'recommended':'all';renderCollections();render()}
function card(v){const x=v.x,p=v.p,f=marketIsFavorite(x.slug);return '<article class="card"><div class="badges">'+v.badges.slice(0,2).map(b=>'<span>'+b+'</span>').join('')+'</div><button class="fav '+(f?'on':'')+'" onclick="event.stopPropagation();marketToggleFavorite(\''+x.slug+'\');summary();render()">'+(f?'♥':'♡')+'</button><div class="preview"><img src="'+makeTemplatePreview(x,p)+'" alt="'+(x.display_name||x.name)+'"></div><div class="body"><img class="tplLogo" src="'+makeIndustryLogo(x.name,x.accent,x.family)+'"><div class="meta"><h3>'+(x.display_name||x.name)+'</h3><span class="badge">'+x.category+'</span></div><div class="desc">'+x.headline+'</div><div class="audience">适合：'+v.position+' · '+v.uses.slice(0,2).join(' / ')+'</div><div class="chips"><span class="chip">'+(MARKET_STYLE_NAMES[p.style]||p.style)+'</span><span class="chip">'+(MARKET_LAYOUT_NAMES[p.layout]||p.layout)+'</span></div><div class="features">'+v.features.slice(0,4).join(' · ')+'</div><div class="stats"><span>★ <b>'+v.stats.rating.toFixed(1)+'</b></span><span>安装 <b>'+marketNum(v.stats.installs)+'</b></span><span>浏览 <b>'+marketNum(v.stats.views)+'</b></span></div><div class="actions"><a class="btn" target="_blank" rel="noopener" href="'+x.preview+'" onclick="marketMarkRecent(\''+x.slug+'\')">预览 ↗</a><a class="btn" href="./template-detail.html?slug='+encodeURIComponent(x.slug)+'">详情</a><a class="btn dark" href="./cms.html#theme-market">安装</a></div></div></article>'}
function render(){
 let rows=meta.filter(v=>(!industry.value||v.x.industry_slug===industry.value)&&(!cat.value||v.x.category===cat.value)&&(!style.value||v.p.style===style.value)&&(!use.value||v.uses.includes(use.value))&&marketMatches(v,q.value));
 if(tab==='recommended')rows=rows.filter(v=>marketInCollection(v,collection));
 if(tab==='mine')rows=rows.filter(v=>marketMyFilter(v,my.value||'installed'));
 rows=marketSort(rows,sort.value);
 const per=16,max=Math.max(1,Math.ceil(rows.length/per));page=Math.min(page,max);const view=rows.slice((page-1)*per,page*per);
 count.textContent='找到 '+rows.length+' 套';sectionTitle.textContent=tab==='recommended'?'精选推荐':tab==='industry'?'按行业找模板':tab==='style'?'按风格找模板':'我的模板';sectionDesc.textContent=tab==='recommended'?'综合匹配度、安装、收藏、评分与近期热度。':tab==='industry'?'先选行业，再比较该行业的不同模板定位。':tab==='style'?'按照视觉风格和商业定位寻找模板。':'已安装、收藏和最近浏览都在这里。';
 grid.innerHTML=view.map(card).join('')||'<div style="grid-column:1/-1;padding:45px;text-align:center;color:#64748b">没有找到匹配模板</div>';
 pager.innerHTML='';for(let i=1;i<=Math.min(max,8);i++)pager.insertAdjacentHTML('beforeend','<button class="'+(i===page?'on':'')+'" onclick="page='+i+';render()">'+i+'</button>');
}
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));q.addEventListener('input',()=>{page=1;render()});[industry,cat,style,use,my,sort].forEach(el=>el.addEventListener('change',()=>{page=1;render()}));load();
</script></body></html>
