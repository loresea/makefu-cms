talog .visual{background:linear-gradient(135deg,#111827 0 44%,var(--accent) 44% 60%,#f3f4f6 60%)}.family-technical-spec .visual{background:linear-gradient(145deg,var(--accent) 0 57%,#dbeafe 57%)}.family-portfolio-editorial .visual{background:linear-gradient(90deg,#f5f5f4 0 32%,var(--accent) 32% 100%)}.family-professional-trust .visual{background:linear-gradient(135deg,var(--accent),#0f172a 68%,#d4a373 68%)}.family-service-conversion .visual{background:linear-gradient(135deg,#0f172a 0 60%,var(--accent) 60%)}.family-healthcare-trust .visual{background:linear-gradient(135deg,#fff 0 40%,var(--accent) 40% 53%,#e0f2fe 53%)}.family-education-programs .visual{background:linear-gradient(135deg,var(--accent) 0 45%,#fef3c7 45% 65%,#fff 65%)}.family-creative-agency .visual{background:linear-gradient(120deg,#111 0 36%,var(--accent) 36% 65%,#fafafa 65%)}.family-ecommerce-showcase .visual{background:linear-gradient(135deg,#fff7ed 0 30%,var(--accent) 30% 70%,#fff 70%)}.family-environment-energy .visual{background:linear-gradient(135deg,#052e16 0 42%,var(--accent) 42% 60%,#ecfdf5 60%)}.family-home-living .visual{background:linear-gradient(135deg,#fafaf9 0 38%,var(--accent) 38% 55%,#e7e5e4 55%)}.family-corporate-tech .visual{background:linear-gradient(135deg,#0f172a 0 50%,var(--accent) 50% 68%,#eff6ff 68%)}.family-hospitality-experience .visual{background:linear-gradient(135deg,#422006 0 42%,var(--accent) 42% 55%,#fef3c7 55%)}.family-food-brand .visual{background:linear-gradient(135deg,#fef3c7,var(--accent) 55%,#fff 55%)}.family-logistics-map .visual{background:linear-gradient(135deg,#0f172a 0 45%,#e2e8f0 45% 55%,var(--accent) 55%)}.family-automotive-showroom .visual{background:linear-gradient(135deg,#09090b 0 56%,var(--accent) 56% 66%,#fafafa 66%)}.family-local-services .visual{background:linear-gradient(135deg,#fff 0 38%,var(--accent) 38% 58%,#f3f4f6 58%)}.family-real-estate-listings .visual{background:linear-gradient(135deg,#1e293b 0 45%,var(--accent) 45% 58%,#f5f5f4 58%)}.body{padding:15px;display:flex;flex-direction:column;gap:8px;flex:1}.topline{display:flex;justify-content:space-between;gap:10px;align-items:start}.topline h3{margin:0;font-size:18px}.badge{font-size:10px;padding:4px 7px;background:#f3f4f6;border-radius:99px;color:#64748b}.body p{margin:0;color:#64748b;min-height:44px}.actions{display:flex;gap:8px;margin-top:auto;padding-top:7px}.btn{display:inline-flex;justify-content:center;align-items:center;padding:8px 10px;border:1px solid #d8dde6;border-radius:8px;font-weight:800;background:#fff;cursor:pointer}.btn.dark{background:#111827;color:#fff;border-color:#111827}.count{color:#64748b}.empty{grid-column:1/-1;padding:40px;text-align:center;color:#64748b}.note{background:#fffbeb;border:1px solid #fde68a;color:#92400e;padding:12px 14px;border-radius:11px;margin-bottom:18px}@media(max-width:1100px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.toolbar{grid-template-columns:1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}.wrap{width:calc(100% - 24px)}.hero h1{font-size:35px}.topin{height:auto;padding:12px 0;align-items:flex-start}}</style></head>
<body><header class="top"><div class="wrap topin"><div class="brand"><div class="logo">M</div><div>码科服 CMS<br><small style="font-weight:600;color:#64748b">行业模板库</small></div></div><a class="back" href="./cms.html#themes">返回模板管理</a></div></header>
<main class="wrap"><section class="hero"><h1>100 个常用行业模板</h1><p>模板可以直接在线预览，不需要先安装。正式启用时再选择：仅安装模板、模板 + 补充空白行业内容、或模板 + 完整行业演示数据。</p><div class="stats"><div class="stat"><b id="total">100</b> 个行业模板</div><div class="stat"><b id="familyCount">19</b> 套结构体系</div><div class="stat"><b>3</b> 种安装策略</div></div></section>
<div class="note">行业模板不是 100 份互不相关的重复代码：每个行业拥有独立行业配置、内容包和模块组合，底层复用经过验证的布局组件。这样既能保持行业差异，也能保证后续统一升级与维护。</div>
<div class="toolbar"><input id="q" class="search" placeholder="搜索行业，例如：机械、装修、律师、教育…"><select id="cat" class="category"><option value="">全部行业分类</option></select></div>
<div class="count" id="count"></div><section class="grid" id="grid"></section></main>
<script>
let all=[];
const familyName={industrial-catalog:'工业产品型',technical-spec:'技术参数型','portfolio-editorial':'作品展示型','professional-trust':'专业信任型','service-conversion':'服务获客型','healthcare-trust':'医疗信任型','education-programs':'课程教育型','creative-agency':'创意作品型','ecommerce-showcase':'商品展示型','environment-energy':'能源环保型','home-living':'家居生活型','corporate-tech':'科技企业型','hospitality-experience':'体验预订型','food-brand':'食品品牌型','logistics-map':'物流网络型','automotive-showroom':'汽车展示型','local-services':'本地服务型','real-estate-listings':'地产项目型','destination-explorer':'目的地探索型'};
async function load(){const d=await fetch('./industries.json');const j=await d.json();all=j.industries;total.textContent=j.count;familyCount.textContent=Object.keys(j.families).length;const cats=[...new Set(all.map(x=>x.category))].sort();cats.forEach(x=>cat.insertAdjacentHTML('beforeend','<option>'+x+'</option>'));render()}
function render(){const query=q.value.trim().toLowerCase(),c=cat.value;const rows=all.filter(x=>(!c||x.category===c)&&(!query||(x.name+x.category+x.slug).toLowerCase().includes(query)));count.textContent='当前显示 '+rows.length+' 个模板';grid.innerHTML=rows.length?rows.map(x=>'<article class="card family-'+x.family+'"><div class="visual" style="--accent:'+x.accent+'"></div><div class="body"><div class="topline"><h3>'+x.name+'</h3><span class="badge">'+x.category+'</span></div><p>'+x.headline+'</p><div class="badge" style="align-self:flex-start">'+(familyName[x.family]||x.family)+'</div><div class="actions"><a class="btn" target="_blank" rel="noopener" href="'+x.preview+'">直接预览 ↗</a><a class="btn dark" href="./cms.html#themes">安装 / 启用</a></div></div></article>').join(''):'<div class="empty">没有找到匹配的行业模板。</div>'}
q.addEventListener('input',render);cat.addEventListener('change',render);load();
</script></body></html>
