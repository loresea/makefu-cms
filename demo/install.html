<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>码科服 CMS 安装向导</title><style>
*{box-sizing:border-box}body{margin:0;font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#f5f7fb;color:#111827}.wrap{width:min(920px,calc(100% - 30px));margin:50px auto}.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:20px;margin-bottom:25px}.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#fbbf24,#f97316);display:grid;place-items:center}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;box-shadow:0 20px 60px #0001;overflow:hidden}.head{padding:26px;border-bottom:1px solid #eee}.head h1{margin:0 0 7px}.head p{margin:0;color:#6b7280}.steps{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid #eee}.step{padding:14px;text-align:center;color:#9ca3af}.step.on{color:#111827;font-weight:800;border-bottom:3px solid #f59e0b}.body{padding:28px}.panel{display:none}.panel.on{display:block}.check{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px dashed #e5e7eb}.ok{color:#16a34a;font-weight:800}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field input,.field select{padding:11px;border:1px solid #d1d5db;border-radius:9px}.foot{padding:18px 28px;border-top:1px solid #eee;display:flex;justify-content:space-between}.btn{border:1px solid #ddd;background:#fff;border-radius:9px;padding:9px 14px;font-weight:800;cursor:pointer}.btn.dark{background:#111827;color:#fff;border-color:#111827}.done{text-align:center;padding:20px}.done b{font-size:28px;display:block;margin:12px}.badge{display:inline-flex;padding:4px 9px;border-radius:99px;background:#ecfdf5;color:#15803d;font-weight:800}@media(max-width:650px){.steps{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.field.full{grid-column:auto}}</style></head><body><div class="wrap"><div class="brand"><div class="logo">M</div>码科服 CMS 安装向导</div><div class="card"><div class="head"><h1>上传即可安装</h1><p>默认使用 SQLite，不需要填写数据库地址、账号或密码。</p></div><div class="steps"><div class="step on">1 环境检测</div><div class="step">2 站点信息</div><div class="step">3 管理员</div><div class="step">4 完成</div></div><div class="body">
<div class="panel on"><div class="check"><span>PHP 8.3+</span><span class="ok">通过</span></div><div class="check"><span>PDO SQLite</span><span class="ok">通过</span></div><div class="check"><span>OpenSSL / ZIP / Fileinfo / Sodium</span><span class="ok">通过</span></div><div class="check"><span>storage 可写</span><span class="ok">通过</span></div><div class="check"><span>数据库目录不可公开访问</span><span class="ok">通过</span></div></div>
<div class="panel"><div class="grid"><label class="field full">网站名称<input value="我的企业官网"></label><label class="field">公司名称<input value="杭州示例科技有限公司"></label><label class="field">默认语言<select><option>简体中文</option><option>English</option></select></label><label class="field full">网站地址<input value="https://example.com"></label></div></div>
<div class="panel"><div class="grid"><label class="field">管理员姓名<input value="管理员"></label><label class="field">管理员邮箱<input value="admin@example.com"></label><label class="field full">管理员密码<input type="password" value="Demo123456!"></label><label class="field full">确认密码<input type="password" value="Demo123456!"></label></div></div>
<div class="panel"><div class="done"><span class="badge">安装成功</span><b>码科服 CMS 已准备就绪</b><p>已自动创建 SQLite 数据库、数据表、默认模板和管理员账号。</p><a class="btn dark" href="./login.html">进入后台登录</a></div></div>
</div><div class="foot"><button class="btn" id="prev">上一步</button><button class="btn dark" id="next">下一步</button></div></div></div><script>
let i=0;const ps=[...document.querySelectorAll('.panel')],ss=[...document.querySelectorAll('.step')];function draw(){ps.forEach((x,n)=>x.classList.toggle('on',n===i));ss.forEach((x,n)=>x.classList.toggle('on',n===i));prev.style.visibility=i?'visible':'hidden';next.textContent=i===3?'重新体验':'下一步'}next.onclick=()=>{i=i===3?0:Math.min(3,i+1);draw()};prev.onclick=()=>{i=Math.max(0,i-1);draw()};draw()</script></body></html>
