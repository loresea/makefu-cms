name: Demo Smoke Test

on:
  push:
    branches: [main]
    paths:
      - "demo/**"
      - ".github/workflows/demo-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify required demo pages
        run: |
          test -f demo/index.html
          test -f demo/cms.html
          test -f demo/template.html
          test -f demo/login.html
          test -f demo/install.html
          test -f demo/travel.html
          test -f demo/renovation.html
          test -f demo/renovation-modern.html
          test -f demo/renovation-natural.html
          test -f demo/renovation-luxury.html
          test -f demo/renovation-retro.html
          test -f demo/renovation-oriental.html
          test -f demo/renovation-urban.html
          test -f demo/renovation-market.html
          test -f demo/renovation-page.html
          test -f demo/renovation-showcase.css
          test -f demo/renovation-showcase.js
          test -f demo/renovation-variants.json
          test -f demo/accounting.html
          test -f demo/lawyer.html
          test -f demo/industry-market.html
          test -f demo/industry.html
          test -f demo/industries.json
          test -f demo/industry-packs.json
          test -f demo/template-matrix.json
          test -f demo/site.css
          test -f demo/site.js
          test -f demo/design-system.css
          test -f demo/template-presets.js
          test -f demo/image-library.js
          test -f demo/motion.js
          test -f demo/template-preview.js
          test -f demo/template-market-data.js
          test -f demo/template-detail.html
          test -f demo/logo.js
          test -f demo/site-home.html
          test -f demo/site-products.html
          test -f demo/site-product.html
          test -f demo/site-cases.html
          test -f demo/site-case.html
          test -f demo/site-news.html
          test -f demo/site-news-detail.html
          test -f demo/site-about.html
          test -f demo/site-contact.html
          test -f demo/editor.html
          test -f demo/article-editor.html

      - name: Verify admin and multi-page behavior
        run: |
          grep -q 'id="frontLink".*target="_blank"' demo/cms.html
          grep -q 'position:fixed;left:0;top:0;bottom:0;width:184px' demo/cms.html
          grep -q "location.href='./article-editor.html'" demo/cms.html
          grep -q 'site-news-detail.html' demo/site.js
          grep -q 'site-products.html' demo/site.js
          grep -q 'site-cases.html' demo/site.js
          grep -q 'site-about.html' demo/site.js
          grep -q 'site-contact.html' demo/site.js
          grep -q 'industryLogoMarkup' demo/site.js
          grep -q '浙ICP备2026XXXX号-1' demo/site.js
          grep -q 'https://www.makefu.com/' demo/site.js
          grep -q '找到和客户想法匹配的网站模板' demo/industry-market.html
          grep -q 'templateMarketSearch' demo/cms.html
          grep -q 'templateMarketStyle' demo/cms.html
          grep -q 'text-align:center' demo/design-system.css
          grep -q 'data-layout' demo/design-system.css
          grep -q 'IMAGE_POOLS' demo/image-library.js
          grep -q 'contentGridColumns' demo/site.js
          grep -q 'brand-center' demo/template-presets.js
          grep -q 'stacked' demo/design-system.css
          grep -q 'nav_variants' demo/template-matrix.json
          grep -q 'makeTemplatePreview' demo/industry-market.html
          grep -q 'makeTemplatePreview' demo/cms.html
          grep -q 'templateMarketSort' demo/cms.html
          grep -q 'data-market-tab="mine"' demo/cms.html
          grep -q 'MARKET_COLLECTIONS' demo/template-market-data.js
          grep -q 'template-detail.html' demo/industry-market.html
          grep -q 'renovation-variants.json' demo/cms.html
          grep -q '"count": 6' demo/renovation-variants.json
          grep -q 'case-detail' demo/renovation-showcase.js
          grep -q 'service-detail' demo/renovation-showcase.js
          grep -q 'style-detail' demo/renovation-showcase.js
          grep -q 'designer-detail' demo/renovation-showcase.js
          grep -q 'article-detail' demo/renovation-showcase.js
          grep -q 'materials' demo/renovation-showcase.js

      - name: Check internal demo links
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlparse

          root = Path("demo")

          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links = []
              def handle_starttag(self, tag, attrs):
                  if tag == "a":
                      d = dict(attrs)
                      if "href" in d:
                          self.links.append(d["href"])

          errors = []
          for html in root.glob("*.html"):
              p = Parser()
              p.feed(html.read_text(encoding="utf-8"))
              for href in p.links:
                  if not href or href.startswith(("#","http://","https://","mailto:","tel:","javascript:")):
                      continue
                  target = href.split("#",1)[0].split("?",1)[0]
                  if not target:
                      continue
                  path = (html.parent / target).resolve()
                  if not path.exists():
                      errors.append(f"{html}: missing {href}")
          if errors:
              raise SystemExit("\n".join(errors))
          print("Internal links OK")
          PY

      - name: Validate industry content packs
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          required = ["travel","renovation","accounting","lawyer"]
          for slug in required:
              p = Path("demo/content-packs") / f"{slug}.json"
              assert p.exists(), f"missing {p}"
              data = json.loads(p.read_text(encoding="utf-8"))
              assert data.get("theme") == slug
              assert data.get("menus")
              assert data.get("blocks")
          print("Industry content packs OK")
          PY

      - name: Validate 200-industry registry
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          reg = json.loads(Path("demo/industries.json").read_text(encoding="utf-8"))
          packs = json.loads(Path("demo/industry-packs.json").read_text(encoding="utf-8"))
          assert reg["count"] == 200, reg["count"]
          assert len(reg["industries"]) == 200
          assert packs["count"] == 200, packs["count"]
          assert len(packs["packs"]) == 200
          slugs = {x["slug"] for x in reg["industries"]}
          pack_slugs = {x["slug"] for x in packs["packs"]}
          assert slugs == pack_slugs
          matrix = json.loads(Path("demo/template-matrix.json").read_text(encoding="utf-8"))
          assert matrix["count"] == 200
          assert matrix["unique_fingerprints"] == 200
          assert len(matrix.get("nav_variants", [])) == 8
          fingerprints = [x["fingerprint"] for x in matrix["templates"]]
          assert len(fingerprints) == len(set(fingerprints)) == 200
          assert {x["slug"] for x in matrix["templates"]} == slugs
          print("200-industry registry, content packs and unique design matrix OK")
          PY

      - name: Audit renovation grid completeness
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const source = fs.readFileSync('demo/renovation-showcase.js', 'utf8');
          const sandbox = {
            document: { addEventListener() {}, querySelector() { return null; } },
            location: { search: '' },
            URLSearchParams,
            console,
          };
          vm.createContext(sandbox);
          vm.runInContext(source + '\n;globalThis.__THEMES=THEMES;', sandbox);
          const themes = sandbox.__THEMES;
          const names = Object.keys(themes);
          if (names.length !== 6) throw new Error('Expected 6 renovation themes, got ' + names.length);
          for (const name of names) {
            const t = themes[name];
            if (!t.caseCols || t.caseTitles.length % t.caseCols !== 0) {
              throw new Error(name + ': case grid has orphan items: ' + t.caseTitles.length + ' / ' + t.caseCols);
            }
            if (!t.styleCols || t.styles.length % t.styleCols !== 0) {
              throw new Error(name + ': style grid has orphan items: ' + t.styles.length + ' / ' + t.styleCols);
            }
          }
          console.log('Renovation grids close cleanly for all 6 themes');
          NODE

      - name: Check inline JavaScript syntax
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.in_script = False
                  self.buf = []
                  self.scripts = []
              def handle_starttag(self, tag, attrs):
                  if tag == "script":
                      self.in_script = True
                      self.buf = []
              def handle_endtag(self, tag):
                  if tag == "script" and self.in_script:
                      self.scripts.append("".join(self.buf))
                      self.in_script = False
              def handle_data(self, data):
                  if self.in_script:
                      self.buf.append(data)

          out = Path("/tmp/demo-js")
          out.mkdir(exist_ok=True)
          n = 0
          for html in Path("demo").glob("*.html"):
              p = Scripts()
              p.feed(html.read_text(encoding="utf-8"))
              for script in p.scripts:
                  if script.strip():
                      n += 1
                      (out / f"{n}.js").write_text(script, encoding="utf-8")
          print(f"Extracted {n} scripts")
          PY
          for f in /tmp/demo-js/*.js; do node --check "$f"; done
          node --check demo/site.js
          node --check demo/logo.js
          node --check demo/template-presets.js
          node --check demo/image-library.js
          node --check demo/motion.js
          node --check demo/template-preview.js
          node --check demo/template-market-data.js
          node --check demo/renovation-showcase.js
