name: Demo Smoke Test

on:
  push:
    branches: [main]
    paths:
      - "demo/**"
      - ".github/workflows/demo-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify V2 template system files
        run: |
          test -f demo/index.html
          test -f demo/cms.html
          test -f demo/login.html
          test -f demo/install.html
          test -f demo/industry-market.html
          test -f demo/template-detail.html
          test -f demo/industry-template.html
          test -f demo/industry-template.css
          test -f demo/industry-template.js
          test -f demo/industry-template-system.js
          test -f demo/industry-deep-profiles.js
          test -f demo/industries.json
          test -f demo/module-registry.json
          test -f demo/template-presets.js
          test -f demo/template-preview.js
          test -f demo/template-market-data.js
          test -f demo/image-library.js
          test -f demo/logo.js
          test -f demo/article-editor.html
          test -f demo/renovation-modern.html
          test -f demo/renovation-natural.html
          test -f demo/renovation-luxury.html
          test -f demo/renovation-retro.html
          test -f demo/renovation-oriental.html
          test -f demo/renovation-urban.html
          test -f demo/renovation-showcase.css
          test -f demo/renovation-showcase.js

      - name: Verify admin and marketplace behavior
        run: |
          grep -q 'id="frontLink".*target="_blank"' demo/cms.html
          grep -q 'position:fixed;left:0;top:0;bottom:0;width:184px' demo/cms.html
          grep -q "location.href='./article-editor.html'" demo/cms.html
          grep -q 'templateMarketSearch' demo/cms.html
          grep -q 'templateMarketIndustry' demo/cms.html
          grep -q 'templateMarketStyle' demo/cms.html
          grep -q 'templateMarketSort' demo/cms.html
          grep -q 'data-market-tab="mine"' demo/cms.html
          grep -q 'buildIndustryTemplates' demo/cms.html
          grep -q 'industry-deep-profiles.js' demo/cms.html
          grep -q 'buildIndustryManifest' demo/cms.html
          grep -q 'makefu-active-industry-pack' demo/cms.html
          grep -q 'applyIndustryPack' demo/cms.html
          grep -q 'module-registry.json' demo/cms.html
          grep -q '旧版单模板已退役' demo/cms.html
          grep -q '找到和客户想法匹配的网站模板' demo/industry-market.html
          grep -q '1200 套行业模板' demo/industry-market.html
          grep -q 'id="industry"' demo/industry-market.html
          grep -q 'template-detail.html' demo/industry-market.html
          grep -q 'MARKET_COLLECTIONS' demo/template-market-data.js
          grep -q 'getIndustryVisuals' demo/image-library.js
          grep -q 'RELATED_IMAGE_POOLS' demo/image-library.js
          grep -q 'getIndustryVisuals' demo/template-preview.js
          grep -q 'image-library.js' demo/industry-market.html
          grep -q 'image-library.js' demo/template-detail.html
          grep -q 'mediaQuote' demo/industry-template.js
          grep -q 'subHeroMedia' demo/industry-template.js
          grep -q 'industry-template.html' demo/industry-template-system.js

      - name: Check internal demo links
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          root = Path("demo")
          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__(); self.links=[]
              def handle_starttag(self, tag, attrs):
                  if tag=="a":
                      d=dict(attrs)
                      if "href" in d:self.links.append(d["href"])
          errors=[]
          for html in root.glob("*.html"):
              p=Parser(); p.feed(html.read_text(encoding="utf-8"))
              for href in p.links:
                  if not href or href.startswith(("#","http://","https://","mailto:","tel:","javascript:")): continue
                  target=href.split("#",1)[0].split("?",1)[0]
                  if not target: continue
                  if not (html.parent/target).resolve().exists(): errors.append(f"{html}: missing {href}")
          if errors: raise SystemExit("\n".join(errors))
          print("Internal links OK")
          PY

      - name: Validate 200 deep industry profiles and 1200 templates
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const industries=JSON.parse(fs.readFileSync('demo/industries.json','utf8')).industries;
          if(industries.length!==200)throw new Error('Expected 200 industries');
          const deep=fs.readFileSync('demo/industry-deep-profiles.js','utf8');
          const sys=fs.readFileSync('demo/industry-template-system.js','utf8');
          const sandbox={window:{},console,encodeURIComponent};
          vm.createContext(sandbox);
          vm.runInContext(deep+'\n'+sys+'\n;globalThis.__build=buildIndustryTemplates;globalThis.__manifest=buildIndustryManifest;globalThis.__bp=getIndustryBlueprint;globalThis.__deep=getDeepIndustryProfile;globalThis.__map=INDUSTRY_DEEP_MAP;',sandbox);
          const catalog=sandbox.__build(industries);
          if(catalog.length!==1200)throw new Error('Expected 1200 templates, got '+catalog.length);
          if(new Set(catalog.map(x=>x.slug)).size!==1200)throw new Error('Template slugs are not unique');
          const missing=industries.filter(x=>!sandbox.__deep(x));
          if(missing.length)throw new Error('Industries without deep profile: '+missing.map(x=>x.slug).join(','));
          if(Object.keys(sandbox.__map).length!==200)throw new Error('Deep profile map must cover exactly 200 industries');
          const groups=new Map();
          for(const t of catalog)groups.set(t.industry_slug,(groups.get(t.industry_slug)||0)+1);
          for(const industry of industries){
            if(groups.get(industry.slug)!==6)throw new Error(industry.slug+' does not have exactly 6 templates');
            const bp=sandbox.__bp(industry);
            if(!bp||bp.variants.length!==6)throw new Error(industry.slug+' does not resolve to six deep design directions');
            if(!bp.modules.length||!bp.nav.length||!bp.home.length)throw new Error(industry.slug+' has incomplete business structure');
          }
          for(const t of catalog.filter(x=>x.industry_slug!=='renovation'))if(!t.preview.includes('industry-template.html'))throw new Error('Legacy preview leaked into V2 catalog: '+t.slug);
          console.log('Deep V2 catalog OK: 200 industries × 6 = 1200');
          NODE

      - name: Validate all deep industry manifests against module registry
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const industries=JSON.parse(fs.readFileSync('demo/industries.json','utf8')).industries;
          const registry=JSON.parse(fs.readFileSync('demo/module-registry.json','utf8')).modules;
          const ids=new Set(registry.map(x=>x.id));
          if(ids.size!==registry.length)throw new Error('Duplicate module ids');
          const deep=fs.readFileSync('demo/industry-deep-profiles.js','utf8');
          const sys=fs.readFileSync('demo/industry-template-system.js','utf8');
          const sandbox={window:{},console,encodeURIComponent};vm.createContext(sandbox);
          vm.runInContext(deep+'\n'+sys+'\n;globalThis.__manifest=buildIndustryManifest;',sandbox);
          for(const industry of industries){
            const m=sandbox.__manifest(industry);
            for(const id of m.required_modules)if(!ids.has(id))throw new Error(industry.slug+' requires unknown module '+id);
            for(const g of m.backend_menu)for(const item of g.items)if(!ids.has(item.module))throw new Error(industry.slug+' menu uses unknown module '+item.module);
            if(!m.install_modes.theme_only||!m.install_modes.structure||!m.install_modes.demo)throw new Error(industry.slug+' missing install modes');
            if(!m.profile_label||!m.keywords?.length||!m.metrics?.length)throw new Error(industry.slug+' manifest is not deeply profiled');
          }
          console.log('All 200 deep industry manifests resolve to registered modules');
          NODE

      - name: Audit renovation full-row grids
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const source=fs.readFileSync('demo/renovation-showcase.js','utf8');
          const sandbox={document:{body:{dataset:{}},addEventListener(){},querySelector(){return null}},location:{search:''},URLSearchParams,console};
          vm.createContext(sandbox);vm.runInContext(source+'\n;globalThis.__THEMES=THEMES;',sandbox);
          const themes=sandbox.__THEMES,names=Object.keys(themes);
          if(names.length!==6)throw new Error('Expected 6 renovation themes');
          for(const name of names){
            const t=themes[name];
            if(t.caseTitles.length%t.caseCols!==0)throw new Error(name+' case grid orphan');
            if(t.styles.length%t.styleCols!==0)throw new Error(name+' style grid orphan');
          }
          console.log('Renovation grids close cleanly');
          NODE

      - name: Check JavaScript syntax
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Scripts(HTMLParser):
              def __init__(self): super().__init__(); self.ins=False; self.buf=[]; self.scripts=[]
              def handle_starttag(self,tag,attrs):
                  if tag=="script" and not dict(attrs).get("src"): self.ins=True; self.buf=[]
              def handle_endtag(self,tag):
                  if tag=="script" and self.ins:self.scripts.append("".join(self.buf));self.ins=False
              def handle_data(self,data):
                  if self.ins:self.buf.append(data)
          out=Path("/tmp/demo-js");out.mkdir(exist_ok=True);n=0
          for html in Path("demo").glob("*.html"):
              p=Scripts();p.feed(html.read_text(encoding="utf-8"))
              for script in p.scripts:
                  if script.strip():
                      n+=1;(out/f"{n}.js").write_text(script,encoding="utf-8")
          print("Extracted",n,"inline scripts")
          PY
          for f in /tmp/demo-js/*.js; do node --check "$f"; done
          node --check demo/logo.js
          node --check demo/image-library.js
          node --check demo/template-presets.js
          node --check demo/template-preview.js
          node --check demo/template-market-data.js
          node --check demo/industry-deep-profiles.js
          node --check demo/industry-template-system.js
          node --check demo/industry-template.js
          node --check demo/renovation-showcase.js
